<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hamilton Visualizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #1b1e23; color: #e8eaed; font-family: system-ui, sans-serif; overflow: hidden; }
    #canvas-container { position: absolute; inset: 0; }
    #canvas-container canvas { display: block; }

    #hud { position: absolute; top: 12px; left: 12px; z-index: 10; pointer-events: none; }
    #status { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; background: rgba(20,22,26,0.85); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #888; }
    #status.connected .dot { background: #35c46a; }
    #status.disconnected .dot { background: #d9534f; }
    #replay-btn, #start-btn, #reset-btn { pointer-events: auto; margin-left: 8px; color: #e8eaed; border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
    #replay-btn:disabled, #start-btn:disabled, #reset-btn:disabled { opacity: 0.5; cursor: default; }
    #start-btn { background: #2ea364; border: 1px solid #2ea364; color: #0c1a12; font-weight: 600; }
    #start-btn:hover:not(:disabled) { background: #35bd73; }
    #start-btn.started { display: none; }
    /* Replay (blue) and Reset (amber) get distinct tinted backgrounds so
       they're easy to tell apart at a glance, not just by their labels --
       neither is styled as a plain neutral button like #speed-select. */
    #replay-btn { background: rgba(47,91,130,0.35); border: 1px solid #3f6f9e; }
    #replay-btn:hover:not(:disabled) { background: rgba(47,91,130,0.55); }
    #reset-btn { background: rgba(168,90,30,0.35); border: 1px solid #a86a2e; display: none; }
    #reset-btn:hover:not(:disabled) { background: rgba(168,90,30,0.55); }
    #reset-btn.visible { display: inline-block; }
    #speed-select { pointer-events: auto; margin-left: 8px; background: rgba(20,22,26,0.85); color: #e8eaed; border: 1px solid #3a3f47; border-radius: 6px; padding: 6px 8px; font-size: 13px; cursor: pointer; }

    /* Hidden by default -- a protocol script opts in by calling
       server.set_run_params([...]) (see main.js's renderRunParams()); most
       demos never do, and the row should simply not exist for them rather
       than show inputs they don't read. */
    #run-params { pointer-events: auto; display: none; align-items: center; gap: 8px; margin-left: 8px; background: rgba(20,22,26,0.85); border: 1px solid #3a3f47; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #b7bcc4; }
    #run-params.visible { display: inline-flex; }
    #run-params label { display: inline-flex; align-items: center; gap: 4px; }
    #run-params input[type="number"], #run-params input[type="text"] { background: rgba(0,0,0,0.35); color: #e8eaed; border: 1px solid #3a3f47; border-radius: 4px; padding: 3px 4px; font-size: 12px; }
    #run-params input[type="number"] { width: 46px; }
    #run-params input[type="text"] { width: 68px; text-transform: uppercase; letter-spacing: 0.08em; }
    #run-params input:disabled { opacity: 0.6; }
    /* Red border while a "text" field is short of its declared length --
       the same signal that's keeping "Start Protocol" disabled (see
       main.js's runParamsValid()), not just a silent grey button. */
    #run-params input[type="text"]:invalid { border-color: #d9534f; }
    #run-params .readout { color: #59c9a5; white-space: nowrap; }

    #tooltip { position: absolute; z-index: 10; pointer-events: none; background: rgba(20,22,26,0.92); border: 1px solid #3a3f47; padding: 6px 8px; border-radius: 6px; font-size: 12px; line-height: 1.4; display: none; max-width: 260px; }
    #tooltip .name { font-weight: 600; }
    #tooltip .type { color: #9aa0a8; }
    #tooltip .model { color: #7fb0e0; font-family: monospace; }
    #tooltip .volume { color: #59c9a5; margin-top: 2px; }

    #legend { position: absolute; bottom: 12px; left: 12px; z-index: 10; background: rgba(20,22,26,0.85); border-radius: 6px; padding: 8px 10px; font-size: 12px; pointer-events: auto; }
    #legend h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #9aa0a8; font-weight: 600; }
    #legend .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    #legend .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

    #log-panel { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 340px; z-index: 10; background: rgba(20,22,26,0.9); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
    #log-panel h3 { margin: 0; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #9aa0a8; border-bottom: 1px solid #3a3f47; font-weight: 600; }
    #log-list { flex: 1; overflow-y: auto; padding: 4px 0; font-size: 12px; }
    #log-list .entry { padding: 5px 10px; border-bottom: 1px solid #262a30; }
    #log-list .entry .op { color: #7fb5ff; font-weight: 600; }
    #log-list .entry .detail { color: #b7bcc4; }
    #log-list .entry .time { color: #666; font-size: 10px; float: right; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="hud">
    <div id="status" class="disconnected"><span class="dot"></span><span id="status-text">connecting...</span></div>
    <!-- Populated dynamically by main.js's renderRunParams() from the
         server's "run_params" message -- empty (and hidden, see the
         #run-params CSS above) unless the running protocol script called
         server.set_run_params([...]). -->
    <div id="run-params"></div>
    <button id="start-btn" disabled title="Tell the waiting protocol script to begin">&#9654; Start Protocol</button>
    <button id="reset-btn" disabled title="Start the whole protocol over with new parameters (only once the current run has finished)">&#8635; Reset</button>
    <button id="replay-btn" disabled title="Re-run everything this server has recorded so far, from the start">&#8635; Replay</button>
    <select id="speed-select" title="Animation playback speed">
      <option value="1">1&times; speed</option>
      <option value="2">0.5&times; speed</option>
      <option value="4">0.25&times; speed</option>
    </select>
  </div>

  <div id="tooltip"></div>

  <div id="legend">
    <h3>Legend</h3>
    <div id="legend-rows"></div>
  </div>

  <div id="log-panel">
    <h3>Event Log</h3>
    <div id="log-list"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/static/vendor/three.module.js",
        "three/addons/controls/OrbitControls.js": "/static/vendor/OrbitControls.js"
      }
    }
  </script>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
