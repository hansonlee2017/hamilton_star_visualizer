[project]
name = "hamilton-visualizer"
version = "0.1.0"
description = "Browser-based isometric visualizer for PyLabRobot Hamilton STAR runs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hanson Lee", email = "hanson.lee.synapse@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["pylabrobot", "hamilton", "star", "liquid-handling", "visualizer", "lab-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.141.1",
    "pylabrobot>=0.2.2",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
    "websockets>=17.0.1",
]

[project.scripts]
hamilton-visualizer = "hamilton_visualizer:main"

[tool.uv.build-backend]
# The frontend ships inside the package (src/hamilton_visualizer/frontend/).
# Its node_modules/ holds only a ~10-line shim so `node --test` can resolve
# the bare "three" specifier during development -- no runtime value, keep it
# out of the built sdist/wheel.
source-exclude = ["src/hamilton_visualizer/frontend/node_modules"]
wheel-exclude = ["frontend/node_modules"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"
