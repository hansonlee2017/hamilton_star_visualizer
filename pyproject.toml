[project]
name = "hamilton-visualizer"
version = "0.1.0"
description = "Browser-based isometric visualizer for PyLabRobot Hamilton STAR runs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Hanson Lee", email = "hanson.lee.synapse@gmail.com" }
]
requires-python = ">=3.14"
keywords = ["pylabrobot", "hamilton", "star", "liquid-handling", "visualizer", "lab-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.141.1",
    "pylabrobot>=0.2.2",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
    "websockets>=17.0.1",
]

[project.urls]
Homepage = "https://github.com/hansonlee2017/hamilton_star_visualizer"
Repository = "https://github.com/hansonlee2017/hamilton_star_visualizer"
Issues = "https://github.com/hansonlee2017/hamilton_star_visualizer/issues"

[project.scripts]
hamilton-visualizer = "hamilton_visualizer:main"

# The browser frontend is a Vite + TypeScript project under frontend/ (dev
# only, not part of the distribution). Its production build is committed to
# src/hamilton_visualizer/frontend/ (index.html + hashed assets/) and ships
# with the wheel, so `uv build` / `pip install` needs no Node -- run
# `npm --prefix frontend run build` after changing anything under frontend/src/.

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"
