[project]
name = "hamilton-visualizer"
version = "0.1.0"
description = "Browser-based isometric visualizer for PyLabRobot Hamilton STAR runs"
readme = "README.md"
authors = [
    { name = "Hanson Lee", email = "hanson.lee.synapse@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pylabrobot>=0.2.2",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
    "websockets>=17.0.1",
]

[project.scripts]
hamilton-visualizer = "hamilton_visualizer:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["uv_build>=0.9.12,<0.10.0"]
build-backend = "uv_build"
